<style>
:root{
  --deep:#0F1A3A; --deep-2:#18264E; --on-deep:#F1F3F4; --on-deep-muted:#A8B4BE; --deep-line:rgba(255,255,255,.12);
  --bg:#F2F3F6; --surface:#FFFFFF; --text:#17212A; --muted:#54626E; --line:#D6DBDF;
  --brass:#F4A81D; --brass-ink:#1A1405; --wa:#0F8A47; --wa-ink:#FFFFFF;
  --wall:#DBD6CB; --wall-dk:#B7B1A4; --wall-r:#9D978A; --slab:#2F3A55; --glass:#6C8AB0; --door:#8B5B35; --ground:#B9B3A6;
  --sky-a:#D8E1E7; --sky-b:#EEF0F0;
  --font-head:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --header-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --deep:#080F26; --deep-2:#111B3C;
    --bg:#10171D; --surface:#18222B; --text:#E9EDF0; --muted:#A3AFB9; --line:#2A3641;
    --wall:#C9C4B9; --wall-dk:#A19B8F; --wall-r:#857F73; --ground:#2B3640;
    --sky-a:#22303B; --sky-b:#18222B;
  }
}
:root[data-theme="dark"]{
  --deep:#080F26; --deep-2:#111B3C;
  --bg:#10171D; --surface:#18222B; --text:#E9EDF0; --muted:#A3AFB9; --line:#2A3641;
  --wall:#C9C4B9; --wall-dk:#A19B8F; --wall-r:#857F73; --ground:#2B3640;
  --sky-a:#22303B; --sky-b:#18222B;
}

*,*::before,*::after{box-sizing:inherit}
html{background:var(--deep);scroll-padding-top:calc(var(--header-h) + env(safe-area-inset-top,0px) + 8px);-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1.0625rem;line-height:1.6}
img,svg{max-width:100%;display:block}
h1,h2,h3,h4{font-family:var(--font-head);font-weight:700;line-height:1.05;margin:0;letter-spacing:.005em}
h2{font-size:clamp(2.1rem,5vw,3.2rem)}
h3{font-size:1.5rem;line-height:1.15}
p{margin:0}
a{color:inherit}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:3px;border-radius:2px}
.wrap{width:min(1180px,100% - 2.5rem);margin-inline:auto}
.skip{position:absolute;left:-999px;top:0;background:var(--brass);color:var(--brass-ink);padding:.6rem 1rem;z-index:100}
.skip:focus{left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:48px;padding:.7rem 1.4rem;border-radius:4px;border:2px solid transparent;font:600 1rem/1 var(--font-body);text-decoration:none;cursor:pointer;transition:background-color .15s,border-color .15s,color .15s}
.btn svg{width:20px;height:20px;flex:none}
.btn-brass{background:var(--brass);color:var(--brass-ink)}
.btn-brass:hover{background:#F0BC4A}
.btn-wa{background:var(--wa);color:var(--wa-ink)}
.btn-wa:hover{background:#0B7439}
.btn-line{border-color:currentColor;color:var(--on-deep);background:transparent}
.btn-line:hover{background:rgba(255,255,255,.1)}
.btn-line-dark{border-color:var(--text);color:var(--text);background:transparent}
.btn-line-dark:hover{background:var(--text);color:var(--bg)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--deep);color:var(--on-deep);border-bottom:1px solid var(--deep-line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:var(--header-h)}
.brand{display:flex;align-items:center;gap:.65rem;text-decoration:none}
.brand-name{font-family:var(--font-head);font-weight:700;font-size:1.65rem;line-height:1;letter-spacing:.04em}
.brand-name small{display:block;font-size:.72rem;font-weight:500;letter-spacing:.34em;color:var(--brass);margin-top:2px}
.brand-logo{display:block;height:46px;width:auto;background:#fff;border-radius:5px;padding:3px 8px}
.ftr .brand-logo{height:56px}
.nav{display:none}
.nav a{text-decoration:none;color:var(--on-deep);font-weight:500;font-size:1rem;padding:.5rem .15rem;border-bottom:2px solid transparent}
.nav a:hover{border-bottom-color:var(--brass)}
.menu-btn{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;background:transparent;border:1px solid var(--deep-line);border-radius:4px;color:var(--on-deep);cursor:pointer}
.menu-btn svg{width:24px;height:24px}
.mnav{display:none;background:var(--deep-2);border-top:1px solid var(--deep-line)}
.mnav.open{display:block}
.mnav a{display:block;padding:.95rem 0;border-bottom:1px solid var(--deep-line);text-decoration:none;color:var(--on-deep);font-weight:500}
.mnav .btn{margin:1rem 0 1.2rem;width:100%}
.hdr-cta{display:none}

/* Hero */
.hero{background:var(--deep);color:var(--on-deep);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--deep-line) 1px,transparent 1px),linear-gradient(90deg,var(--deep-line) 1px,transparent 1px);background-size:48px 48px;opacity:.35;pointer-events:none}
.hero-in{position:relative;display:grid;gap:2.5rem;padding:clamp(2.5rem,7vw,5rem) 0 clamp(2.5rem,6vw,4rem)}
.hero h1{font-size:clamp(3rem,9.5vw,5.6rem);line-height:.95}
.hero h1 span{display:block}
.hero h1 span+span{color:var(--brass)}
.hero-sub{font-family:var(--font-head);font-weight:600;font-size:clamp(1.35rem,3.4vw,1.8rem);margin-top:1.1rem;letter-spacing:.01em}
.hero-lead{margin-top:.8rem;max-width:34rem;color:var(--on-deep-muted)}
.hero-tag{margin-top:1.4rem;font-weight:600;letter-spacing:.2em;font-size:.9rem;color:var(--brass)}
.cta-row{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.6rem}
.hero-points{display:flex;flex-wrap:wrap;gap:.6rem 1.6rem;margin-top:1.8rem;color:var(--on-deep-muted);font-size:.98rem}
.hero-points li{display:flex;align-items:center;gap:.5rem}
.hero-points svg{width:18px;height:18px;color:var(--brass);flex:none}
.hero-art{--ground:#27343F;margin:0;background:var(--deep-2);border:1px solid var(--deep-line);border-radius:6px;padding:.8rem .8rem .5rem}
.hero-art figcaption{font-size:.88rem;color:var(--on-deep-muted);padding:.4rem .3rem .2rem}

/* Sections */
.sec{padding:clamp(3.5rem,8vw,6rem) 0}
.sec-deep{background:var(--deep);color:var(--on-deep)}
.sec-surface{background:var(--surface)}
.sec-head{max-width:40rem;margin-bottom:2.4rem}
.sec-head p{margin-top:.9rem;color:var(--muted)}
.sec-deep .sec-head p{color:var(--on-deep-muted)}

/* About */
.about-grid{display:grid;gap:2.2rem}
.about-copy p+p{margin-top:1rem}
.about-copy{max-width:36rem;color:var(--muted)}
.about-copy p:first-child{color:var(--text);font-size:1.2rem}
.pillars{display:grid;gap:0;border-top:1px solid var(--line)}
.pillars li{padding:1.1rem 0;border-bottom:1px solid var(--line)}
.pillars h3{font-size:1.35rem}
.pillars p{color:var(--muted);margin-top:.25rem}

/* Services */
.svc-grid{display:grid;gap:0;border-top:2px solid var(--text)}
.svc{display:grid;grid-template-columns:48px 1fr;gap:1rem;padding:1.4rem 0;border-bottom:1px solid var(--line)}
.ico{width:40px;height:40px;color:var(--text)}
.ico *{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc p{color:var(--muted);margin-top:.35rem}

/* Why */
.why-grid{display:grid;gap:1px;background:var(--deep-line);border:1px solid var(--deep-line)}
.why{background:var(--deep);padding:1.6rem}
.why svg{width:28px;height:28px;color:var(--brass);margin-bottom:.9rem}
.why svg *{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.why p{color:var(--on-deep-muted);margin-top:.4rem}

/* Packages */
.pk-grid{display:grid;gap:1.2rem}
.pk{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.8rem;display:flex;flex-direction:column}
.pk-name{font-size:1.9rem}
.pk-price{font-family:var(--font-head);font-weight:700;font-size:3.1rem;line-height:1;margin-top:.9rem}
.pk-price small{font-family:var(--font-body);font-size:1rem;font-weight:500;color:var(--muted)}
.pk p.pk-desc{color:var(--muted);margin-top:.7rem}
.pk ul{margin:1.2rem 0 1.6rem;display:grid;gap:.6rem}
.pk li{display:flex;gap:.6rem;align-items:flex-start}
.pk li svg{width:18px;height:18px;margin-top:.28rem;flex:none;color:var(--wa)}
.pk .btn{margin-top:auto}
.pk-top{background:var(--deep);color:var(--on-deep);border-color:var(--deep)}
.pk-top p.pk-desc,.pk-top .pk-price small{color:var(--on-deep-muted)}
.pk-top li svg{color:var(--brass)}
.pk-note{margin-top:1.2rem;color:var(--muted);font-size:.95rem;max-width:44rem}
.est{margin-top:2.4rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.6rem;display:grid;gap:1.4rem}
.est h3{font-size:1.7rem}
.est label{display:block;font-weight:600;margin-bottom:.4rem}
.est-out{display:grid;gap:.5rem;margin:0}
.est-out div{display:flex;justify-content:space-between;gap:1rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.est-out dt{color:var(--muted)}
.est-out dd{margin:0;font-weight:700;font-size:1.15rem}

/* Forms */
.field{display:grid;gap:.35rem}
.field label{font-weight:600;font-size:.98rem}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:1rem;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:.8rem .9rem;min-height:48px}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid var(--brass);outline-offset:1px;border-color:var(--text)}
.fgrid{display:grid;gap:1rem}

/* Projects */
.pj-grid{display:grid;gap:1.4rem}
.pj{background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.pj-art{background:linear-gradient(var(--sky-a),var(--sky-b));aspect-ratio:400/260}
.pj-art svg{width:100%;height:100%}
.pj-body{padding:1.2rem 1.3rem 1.4rem}
.pj-body p{color:var(--muted);margin-top:.3rem;font-size:.98rem}
.pj-meta{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin-top:.8rem;font-size:.92rem;font-weight:600}
.more-row{margin-top:1.8rem;display:flex;flex-wrap:wrap;gap:.75rem}

/* Plans & 3D */
.split{display:grid;gap:2rem;align-items:center}
.split-art{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem}
.split-art figcaption{font-size:.9rem;color:var(--muted);padding:.5rem .2rem 0}
.split-art.iso{background:linear-gradient(var(--sky-a),var(--sky-b))}
.checks{margin-top:1.3rem;display:grid;gap:.7rem}
.checks li{display:flex;gap:.65rem;align-items:flex-start}
.checks svg{width:20px;height:20px;margin-top:.25rem;flex:none;color:var(--wa)}
.split .btn{margin-top:1.6rem}
.pw{fill:var(--surface);stroke:var(--text);stroke-width:5}
.pi{fill:none;stroke:var(--text);stroke-width:2.5}
.pd{fill:var(--surface)}
.pt{font:600 11px var(--font-body);fill:var(--text);text-anchor:middle}
.pt2{font:500 9px var(--font-body);fill:var(--muted);text-anchor:middle}

/* Process */
.steps{counter-reset:s;display:grid;gap:0;border-left:2px solid var(--deep-line);margin-left:.8rem}
.step{position:relative;padding:0 0 1.9rem 2rem}
.step:last-child{padding-bottom:0}
.step::before{counter-increment:s;content:counter(s);position:absolute;left:-1.1rem;top:-.1rem;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--brass);color:var(--brass-ink);font:700 1.1rem/2.1rem var(--font-head);text-align:center}
.step p{color:var(--on-deep-muted);margin-top:.3rem;max-width:36rem}

/* Areas & Embedded Map */
.area-grid{display:grid;gap:1.4rem}
.area-list{display:grid;gap:0;border-top:2px solid var(--text)}
.area-list li{padding:1.2rem 0;border-bottom:1px solid var(--line)}
.area-list p{color:var(--muted);margin-top:.25rem}

.map-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.map-frame {
  width: 100%;
  height: 290px;
  border: 0;
  display: block;
}
.map-body {
  padding: 1.4rem;
  background: var(--deep);
  color: var(--on-deep);
}
.map-body h3 {
  font-size: 1.4rem;
  color: var(--brass);
}
.map-body p {
  color: var(--on-deep-muted);
  margin: 0.35rem 0 1.1rem;
  font-size: 0.95rem;
  line-height: 1.4;
}
.map-body .cta-row {
  margin-top: 0;
}

/* Testimonials */
.tm-grid{display:grid;gap:1.2rem}
.tm{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.6rem;display:flex;flex-direction:column;gap:1.2rem}
.tm blockquote{margin:0;font-size:1.08rem}
.tm-who{display:flex;align-items:center;gap:.8rem;margin-top:auto}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--deep);color:var(--brass);display:grid;place-items:center;font:700 1.1rem var(--font-head)}
.tm-who strong{display:block;line-height:1.2}
.tm-who span{font-size:.92rem;color:var(--muted)}

/* FAQ */
.faq{max-width:50rem;border-top:2px solid var(--text)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;list-style:none;padding:1.15rem 2.4rem 1.15rem 0;font-weight:600;font-size:1.12rem;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:.3rem;top:.9rem;font-size:1.6rem;font-weight:400;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details p{padding:0 0 1.3rem;color:var(--muted);max-width:42rem}

/* Contact */
.ct-grid{display:grid;gap:2.2rem}
.ct-list{display:grid;gap:1rem;margin-top:1.6rem}
.ct-list a{text-decoration:none;font-weight:600;font-size:1.25rem}
.ct-list small{display:block;font-weight:400;font-size:.95rem;color:var(--on-deep-muted)}
.social{display:flex;gap:.7rem;margin-top:1.6rem}
.social a{display:inline-flex;align-items:center;gap:.55rem;min-height:44px;padding:.5rem 1rem;border:1px solid var(--deep-line);border-radius:4px;text-decoration:none;font-weight:500}
.social a:hover{background:rgba(255,255,255,.08)}
.social svg{width:20px;height:20px}
.form-card{background:var(--surface);color:var(--text);border-radius:6px;padding:1.6rem}
.form-card h3{font-size:1.8rem;margin-bottom:.4rem}
.form-card>p{color:var(--muted);margin-bottom:1.3rem}
.form-status{margin-top:.9rem;font-size:.97rem;min-height:1.4em}
.form-status.err{color:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .form-status.err{color:#FF8A80}}
:root[data-theme="dark"] .form-status.err{color:#FF8A80}

/* Footer */
.ftr{background:var(--deep);color:var(--on-deep-muted);padding:3.5rem 0 1.5rem;border-top:1px solid var(--deep-line)}
.ftr-grid{display:grid;gap:2rem}
.ftr h4{font-size:1.2rem;color:var(--on-deep);margin-bottom:.8rem;letter-spacing:.06em}
.ftr li+li{margin-top:.45rem}
.ftr a{text-decoration:none}
.ftr a:hover{color:var(--on-deep);text-decoration:underline}
.ftr-tag{margin-top:1rem;color:var(--brass);font-weight:600;letter-spacing:.2em;font-size:.85rem}
.ftr-bottom{margin-top:2.4rem;padding-top:1.2rem;border-top:1px solid var(--deep-line);font-size:.92rem;display:flex;flex-wrap:wrap;gap:.4rem 1.5rem;justify-content:space-between}
.ftr-bottom{padding-bottom:5.2rem}

/* Mobile action bar */
.mbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;padding:.55rem .75rem calc(.55rem + env(safe-area-inset-bottom,0px));background:var(--deep);border-top:1px solid var(--deep-line)}
.mbar .btn{min-height:46px;padding:.5rem .4rem;font-size:.95rem;gap:.4rem}
.mbar .btn svg{width:18px;height:18px}

/* Tablet */
@media (min-width:640px){
  .svc-grid{grid-template-columns:1fr 1fr;column-gap:3rem}
  .why-grid{grid-template-columns:1fr 1fr}
  .pj-grid{grid-template-columns:1fr 1fr}
  .tm-grid{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .fgrid .full{grid-column:1/-1}
  .ftr-grid{grid-template-columns:1fr 1fr}
  .est{grid-template-columns:1fr 1fr;align-items:end}
  .est .est-head{grid-column:1/-1}
}
/* Desktop */
@media (min-width:960px){
  :root{--header-h:72px}
  .nav{display:flex;gap:1.6rem}
  .hdr-cta{display:inline-flex;min-height:44px}
  .menu-btn,.mnav,.mnav.open{display:none}
  .hero-in{grid-template-columns:1.05fr .95fr;align-items:center;gap:3rem}
  .about-grid{grid-template-columns:1fr 1
